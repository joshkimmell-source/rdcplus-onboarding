<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtor.com+ Onboarding Prototypes</title>
    <style>
      /* Brand red is Haven red.600 (#D92228); the darker blobs use red.800 / red.900. */
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      /* Amorphous gradient: soft red blobs over black, blurred together and drifting slowly. */
      .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; filter: blur(80px); }
      .bg span { position: absolute; border-radius: 50%; mix-blend-mode: screen; animation: drift 24s ease-in-out infinite alternate; }
      .b1 { width: 55vmax; height: 45vmax; left: 5%; top: 10%; background: radial-gradient(circle, #D92228 0%, transparent 65%); opacity: .75; }
      .b2 { width: 50vmax; height: 60vmax; right: 0; top: 30%; background: radial-gradient(circle, #9A1A1E 0%, transparent 65%); animation-duration: 30s; animation-delay: -8s; }
      .b3 { width: 40vmax; height: 35vmax; left: 35%; bottom: 0; background: radial-gradient(circle, #7F1D20 0%, transparent 70%); animation-duration: 36s; animation-delay: -16s; }
      .b4 { width: 30vmax; height: 30vmax; left: 55%; top: 5%; background: radial-gradient(circle, #D92228 0%, transparent 70%); opacity: .45; animation-duration: 28s; animation-delay: -4s; }
      @keyframes drift {
        0% { transform: translate(0, 0) scale(1) rotate(0deg); border-radius: 42% 58% 63% 37% / 45% 40% 60% 55%; }
        50% { transform: translate(6vw, -4vh) scale(1.12) rotate(40deg); border-radius: 60% 40% 35% 65% / 55% 62% 38% 45%; }
        100% { transform: translate(-5vw, 5vh) scale(.92) rotate(-30deg); border-radius: 38% 62% 50% 50% / 62% 38% 62% 38%; }
      }
      @media (prefers-reduced-motion: reduce) { .bg span { animation: none; } }
      main { max-width: 560px; padding: 32px; }
      h1 { font-size: 28px; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: rgba(255, 255, 255, .78); line-height: 1.5; }
      a { display: block; padding: 20px 24px; margin-bottom: 12px; background: rgba(255, 255, 255, .08);
        border: 1px solid rgba(255, 255, 255, .18); border-radius: 12px; color: inherit; text-decoration: none;
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: background .2s, border-color .2s; }
      a:hover { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .5); }
      a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      strong { display: block; font-size: 18px; margin-bottom: 4px; }
      span { color: rgba(255, 255, 255, .78); font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span></div>
    <main>
      <h1>Realtor.com+ onboarding</h1>
      <p>Two first-run prototypes. Both are password protected.</p>
      <a href="./agent/"><strong>Agent</strong><span>Georgia Booth sets up her RealAssist™ AI workspace.</span></a>
      <a href="./consumer/"><strong>Consumer</strong><span>Jordan accepts Georgia’s invite: chat, save homes, request a tour, set up My Home.</span></a>
    </main>
  </body>
</html>
